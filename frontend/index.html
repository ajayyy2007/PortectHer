<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DefendHer - Women Safety App</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>
    <div class="aurora aurora-3"></div>

    <div id="app">
        <!-- Notification Toast -->
        <div id="toast" class="toast hidden"></div>

        <!-- Fake Call Screen -->
        <div id="fake-call-screen" class="hidden">
            <h2 id="caller-id">Mom <br><span style="font-size:1rem;font-weight:400;">Mobile - Incoming call...</span></h2>
            <div class="call-actions">
                <button class="call-btn accept" onclick="stopFakeCall()"> <i class="fa-solid fa-phone"></i> </button>
                <button class="call-btn decline" onclick="stopFakeCall()"> <i class="fa-solid fa-phone-slash"></i> </button>
            </div>
            <audio id="ringtone" loop>
                <source src="https://actions.google.com/sounds/v1/alarms/phone_ringing.ogg" type="audio/ogg">
            </audio>
        </div>

        <!-- Hidden Evidence Capture Elements -->
        <video id="evidence-video" style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;" autoplay muted playsinline></video>
        <canvas id="evidence-canvas" style="display:none;"></canvas>

        <!-- Authentication View -->
        <section id="auth-view" class="view active">
            <div class="auth-container glass-panel">
                <div class="auth-header">
                    <div class="logo">
                        <i class="fa-solid fa-shield-halved"></i>
                        <h1>DefendHer</h1>
                    </div>
                    <p>Your Personal Safety Companion</p>
                </div>
                
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="switchAuthTab('login')">Login</button>
                    <button class="tab-btn" onclick="switchAuthTab('register')">Register</button>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="auth-form active">
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="login-email" placeholder="Email Address" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                </form>

                <!-- Register Form -->
                <form id="register-form" class="auth-form">
                    <div class="input-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="reg-name" placeholder="Full Name" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="reg-email" placeholder="Email Address" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="reg-phone" placeholder="Phone Number" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="reg-password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                </form>
            </div>
        </section>

        <!-- Main App View -->
        <section id="main-view" class="view hidden">
            <nav class="navbar glass-panel">
                <div class="logo">
                    <i class="fa-solid fa-shield-halved"></i>
                    <h2>DefendHer</h2>
                </div>
                <div class="nav-links">
                    <button class="nav-btn active" onclick="switchMainTab('dashboard')"><i class="fa-solid fa-house"></i> Home</button>
                    <button class="nav-btn" onclick="switchMainTab('contacts')"><i class="fa-solid fa-address-book"></i> Contacts</button>
                    <button class="nav-btn btn-danger-outline" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
                </div>
            </nav>

            <div class="main-content">
                <!-- Dashboard Tab -->
                <div id="dashboard-tab" class="tab-content active">
                    <div class="sos-container glass-panel">
                        <h3>Emergency Trigger</h3>
                        <p>Press the button or say "HELP" to send your live location to your contacts.</p>
                        <button id="sos-btn" class="sos-btn pulse-animation">
                            <span>SOS</span>
                        </button>
                        <div id="sos-status" class="status-message"></div>
                        
                        <!-- Advanced Feature Actions -->
                        <div class="advanced-actions">
                            <button class="btn btn-sm btn-secondary" onclick="activateFakeCall()"><i class="fa-solid fa-phone-volume"></i> Fake Call</button>
                        </div>
                    </div>

                    <div class="map-container glass-panel">
                        <div class="map-header">
                            <h3><i class="fa-solid fa-location-dot"></i> Live Location & Nearby Help</h3>
                            <button class="btn btn-sm btn-secondary" onclick="refreshLocation()"><i class="fa-solid fa-arrows-rotate"></i> Refresh</button>
                        </div>
                        <div id="map"></div>
                    </div>
                </div>

                <!-- Contacts Tab -->
                <div id="contacts-tab" class="tab-content hidden">
                    <div class="contacts-layout">
                        <div class="contacts-list glass-panel">
                            <h3>Emergency Contacts</h3>
                            <div id="contacts-container" class="contacts-grid">
                                <!-- Contacts populated dynamically -->
                                <div class="loader"></div>
                            </div>
                        </div>

                        <div class="add-contact-panel glass-panel">
                            <h3><i class="fa-solid fa-user-plus"></i> Add Contact</h3>
                            <form id="add-contact-form">
                                <div class="input-group">
                                    <input type="text" id="contact-name" placeholder="Contact Name" required>
                                </div>
                                <div class="input-group">
                                    <input type="tel" id="contact-phone" placeholder="Phone Number" required>
                                </div>
                                <div class="input-group">
                                    <input type="email" id="contact-email" placeholder="Email Address" required>
                                </div>
                                <div class="input-group">
                                    <select id="contact-relation">
                                        <option value="Family">Family</option>
                                        <option value="Friend">Friend</option>
                                        <option value="Colleague">Colleague</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-primary btn-block">Save Contact</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="js/api.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
