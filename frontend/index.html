<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLARE - Women Safety & Emergency Alert</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS for maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Notification Toast -->
        <div id="toast" class="toast hidden"></div>

        <!-- Hidden audio element for fake call ringtone -->
        <audio id="ringtone" loop src="https://actions.google.com/sounds/v1/ringtones/phone_ring.ogg"></audio>

        <!-- Camera Evidence Capture Viewfinder Badge -->
        <div id="evidence-capture-overlay" style="position: fixed; bottom: 20px; right: 20px; width: 180px; height: 135px; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 30px rgba(229, 62, 62, 0.4); border: 2px solid #e53e3e; background: #000000; z-index: 99999; display: none; transition: all 0.3s ease;">
            <div style="position: absolute; top: 4px; left: 8px; font-size: 11px; color: #fff; background: rgba(229,62,62,0.85); padding: 2px 6px; border-radius: 4px; font-weight: bold; z-index: 2; pointer-events: none;">
                <i class="fa-solid fa-camera fa-beat"></i> SOS Evidence
            </div>
            <video id="evidence-video" style="width: 100%; height: 100%; object-fit: cover;" autoplay playsinline muted></video>
        </div>
        <canvas id="evidence-canvas" style="display: none;"></canvas>

        <!-- Authentication View -->
        <section id="auth-view" class="view active">
            <div class="auth-container glass-panel">
                <div class="auth-header">
                    <div class="logo">
                        <i class="fa-solid fa-shield-halved"></i>
                        <h1>FLARE</h1>
                    </div>
                    <p>Your Personal Safety Companion</p>
                </div>
                
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="switchAuthTab('login')">Login</button>
                    <button class="tab-btn" onclick="switchAuthTab('register')">Register</button>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="auth-form active">
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="login-email" placeholder="Email Address" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                </form>

                <!-- Register Form -->
                <form id="register-form" class="auth-form">
                    <div class="input-group">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="reg-name" placeholder="Full Name" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="reg-email" placeholder="Email Address (Required)" required>
                    </div>

                    <!-- Mobile Number & Country Code Group -->
                    <div class="input-group" style="display: flex; gap: 8px;">
                        <select id="reg-country-code" style="width: 95px; padding: 10px 6px; border-radius: 10px; background: rgba(255, 255, 255, 0.08); color: white; border: 1px solid rgba(255, 255, 255, 0.2); font-size: 0.85rem;">
                            <option value="+91" selected>🇮🇳 +91</option>
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+44">🇬🇧 +44</option>
                            <option value="+61">🇦🇺 +61</option>
                            <option value="+971">🇦🇪 +971</option>
                        </select>
                        <div style="position: relative; flex: 1;">
                            <i class="fa-solid fa-phone" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                            <input type="tel" id="reg-phone" placeholder="Mobile Number" required style="padding-left: 40px; width: 100%;">
                        </div>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="reg-password" placeholder="Password (Min 6 chars)" required>
                    </div>
                    <button type="submit" id="btn-create-account" class="btn btn-primary btn-block">Create Account</button>
                </form>
            </div>
        </section>

        <!-- Main App View -->
        <section id="main-view" class="view hidden">
            <nav class="navbar glass-panel">
                <div class="logo">
                    <i class="fa-solid fa-shield-halved"></i>
                    <h2>FLARE</h2>
                </div>
                <div class="nav-links">
                    <button class="nav-btn active" onclick="switchMainTab('dashboard')"><i class="fa-solid fa-house"></i> Home</button>
                    <button class="nav-btn" onclick="switchMainTab('contacts')"><i class="fa-solid fa-address-book"></i> Contacts</button>
                    <button class="nav-btn btn-danger-outline" onclick="deleteAccount()" style="color:#ef4444; border-color:rgba(239,68,68,0.4);"><i class="fa-solid fa-user-slash"></i> Delete Account</button>
                    <button class="nav-btn btn-danger-outline" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
                </div>
            </nav>

            <div class="main-content">
                <!-- Dashboard Tab -->
                <div id="dashboard-tab" class="tab-content active">
                    <div class="sos-container glass-panel">
                        <h3>Emergency Assistance</h3>
                        <p>Press the button or say "HELP" to dispatch SOS notifications to your emergency contacts.</p>
                        <button id="sos-btn" class="sos-btn pulse-animation" onclick="triggerSOSWorkflow()" title="Click to activate emergency SOS">
                            <span>SOS</span>
                        </button>

                        <!-- SOS Countdown & Cancellation Bar -->
                        <div id="sos-countdown-container" style="display: none; margin-top: 14px; text-align: center;">
                            <div style="font-size: 0.95rem; font-weight: 700; color: #f87171; margin-bottom: 8px;">
                                <i class="fa-solid fa-triangle-exclamation fa-beat"></i> Activating SOS in <span id="sos-countdown-seconds" style="font-size: 1.25rem; color: #ffffff; font-weight: 800; background: #ef4444; padding: 2px 8px; border-radius: 6px;">3</span>s...
                            </div>
                            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 6px;">
                                <button id="btn-cancel-sos" type="button" onclick="cancelSOSCountdown()" class="btn btn-sm" style="background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; border-radius: 20px; padding: 6px 16px; font-weight: 700; cursor: pointer;">
                                    <i class="fa-solid fa-xmark"></i> Cancel (False Alarm)
                                </button>
                                <button type="button" onclick="dispatchSOSNow()" class="btn btn-sm btn-primary" style="border-radius: 20px; padding: 6px 16px; font-weight: 700; cursor: pointer;">
                                    <i class="fa-solid fa-bolt"></i> Send Instantly
                                </button>
                            </div>
                        </div>

                        <div id="sos-status" class="status-message"></div>
                        
                        <!-- Advanced Feature Actions -->
                        <div class="advanced-actions">
                            <button class="btn btn-sm btn-secondary" onclick="activateFakeCall()"><i class="fa-solid fa-phone-volume"></i> Fake Call</button>
                        </div>
                    </div>

                    <div class="map-container glass-panel">
                        <div class="map-header">
                            <h3><i class="fa-solid fa-location-dot"></i> Live Location & Nearby Help</h3>
                            <button class="btn btn-sm btn-secondary" onclick="refreshLocation()"><i class="fa-solid fa-arrows-rotate"></i> Refresh</button>
                        </div>
                        <div id="map"></div>
                    </div>
                </div>

                <!-- Contacts Tab -->
                <div id="contacts-tab" class="tab-content hidden">
                    <div class="contacts-layout">
                        <div class="contacts-list glass-panel">
                            <h3>Emergency Contacts</h3>
                            <div id="contacts-container" class="contacts-grid">
                                <!-- Contacts populated dynamically -->
                                <div class="loader"></div>
                            </div>
                        </div>

                        <div class="add-contact-panel glass-panel">
                            <h3><i class="fa-solid fa-user-plus"></i> Add Contact</h3>
                            <form id="add-contact-form">
                                <div class="input-group">
                                    <input type="text" id="contact-name" placeholder="Contact Name" required>
                                </div>
                                <div class="input-group" style="display: flex; gap: 8px;">
                                    <select id="contact-country-code" style="width: 85px; padding: 10px 4px; border-radius: 10px; background: rgba(255, 255, 255, 0.08); color: white; border: 1px solid rgba(255, 255, 255, 0.2); font-size: 0.85rem;">
                                        <option value="+91" selected>🇮🇳 +91</option>
                                        <option value="+1">🇺🇸 +1</option>
                                        <option value="+44">🇬🇧 +44</option>
                                        <option value="+61">🇦🇺 +61</option>
                                        <option value="+971">🇦🇪 +971</option>
                                    </select>
                                    <input type="tel" id="contact-phone" placeholder="Mobile Phone Number" required style="flex: 1;">
                                </div>
                                <div class="input-group">
                                    <input type="email" id="contact-email" placeholder="Email Address" required>
                                </div>
                                <div class="input-group">
                                    <select id="contact-relation">
                                        <option value="Family">Family</option>
                                        <option value="Friend">Friend</option>
                                        <option value="Colleague">Colleague</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="input-group" style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-muted); margin-top: 4px;">
                                    <input type="checkbox" id="contact-whatsapp-enabled" checked style="width: 18px; height: 18px; accent-color: #25D366;">
                                    <label for="contact-whatsapp-enabled" style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
                                        <i class="fa-brands fa-whatsapp" style="color: #25D366;"></i> Enable WhatsApp Emergency Alerts
                                    </label>
                                </div>
                                <div class="input-group" style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-muted); margin-top: 4px;">
                                    <input type="checkbox" id="contact-email-enabled" checked style="width: 18px; height: 18px; accent-color: #f59e0b;">
                                    <label for="contact-email-enabled" style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
                                        <i class="fa-solid fa-envelope" style="color: #f59e0b;"></i> Enable Email Emergency Alerts
                                    </label>
                                </div>
                                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 12px;">Save Contact</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="js/api.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
